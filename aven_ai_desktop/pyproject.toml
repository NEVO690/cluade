[project]
name = "aven-ai-desktop"
version = "1.1.0"
description = "AVEN AI Desktop - AI assistant (AVEN) and programming assistant (AVEN CODE) for Windows"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # intentional typographic characters in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
