name: Check on-device models

# Downloads the catalog's on-device models (verified) and runs them on the bundled engine.
on:
  push:
    paths:
      - "aven_ai_desktop/app/data/models.json"
      - "aven_ai_desktop/scripts/check_models.py"
      - "aven_ai_desktop/scripts/fetch_engine.py"
      - ".github/workflows/check-models.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [aven-light, aven-core, aven-2]
    defaults:
      run:
        working-directory: aven_ai_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_engine.py --platform linux-x64
      - name: Check ${{ matrix.model }}
        run: python scripts/check_models.py ${{ matrix.model }}
        env:
          AVEN_DATA_DIR: ${{ runner.temp }}/aven-data
