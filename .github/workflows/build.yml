name: Build TAF mod

on:
  workflow_dispatch:
  push:
    branches:
      - taf-mod

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: Win64

      - name: Show all compile errors
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          cmake --build build --config Release -- -k 0 2>&1 | grep -E "error|warning: unused" || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: taf-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
