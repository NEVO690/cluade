name: Build TAF mod

on:
  workflow_dispatch:
  push:
    branches:
      - taf-mod

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: Win64
          build-args: "-- -k 0"

      - uses: actions/upload-artifact@v4
        with:
          name: taf-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
