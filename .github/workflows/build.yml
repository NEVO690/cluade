name: Build TAF mod

on:
  workflow_dispatch:
  push:
    branches:
      - taf-mod

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: Win64

      - name: Show all compile errors
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          cmake --build build --config Release -- -k 0 2>&1 | grep -E "error|warning: unused" || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: taf-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Publish build to taf-build branch
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          find build output -name "*.geode" -exec cp {} out/ \; 2>/dev/null || true
          gh release download v6.0.0-alpha.2 -R geode-sdk/geode -p "*-win.zip" -D out || echo "loader download failed"
          ls -la out
          cd out
          git init -q
          git checkout -q -b taf-build
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" taf-build
