name: Build AVEN AI Desktop (Windows)

on:
  push:
    paths:
      - "aven_ai_desktop/**"
      - "aven_cloud/**"
      - ".github/workflows/build-aven-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aven_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Qt (used by the end-to-end test)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # Real AVEN Local check: real llama.cpp engine, real model download (verified), real answers.
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aven_ai_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch the llama.cpp engine
        run: python scripts/fetch_engine.py --platform linux-x64
      - name: Download AVEN Light and chat with it
        run: python scripts/local_e2e.py
        env:
          AVEN_DATA_DIR: ${{ runner.temp }}/aven-e2e

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Optional code signing: add these repository secrets to sign the exe and installer
      # (base64-encoded .pfx certificate and its password). Without them the build is unsigned.
      AVEN_SIGN_PFX_BASE64: ${{ secrets.AVEN_SIGN_PFX_BASE64 }}
      AVEN_SIGN_PFX_PASSWORD: ${{ secrets.AVEN_SIGN_PFX_PASSWORD }}
      # Public address of your AVEN Cloud server. Set it under
      # Settings → Secrets and variables → Actions → Variables. Empty = users need their own key.
      AVEN_CLOUD_URL: ${{ vars.AVEN_CLOUD_URL }}
    defaults:
      run:
        working-directory: aven_ai_desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Folder build + zip + installer; runs the full test suite first. The PyInstaller bootloader is
      # compiled from source to avoid the antivirus false positives the stock bootloader triggers.
      - name: Build app and installer
        run: ./scripts/build_windows.ps1 -Python python -Installer -BuildBootloader

      - name: Smoke-test packaged executable
        run: |
          $env:AVEN_DATA_DIR = Join-Path $env:RUNNER_TEMP "aven-smoke"
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath "dist\AVEN AI\AVEN AI.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "AVEN AI exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          if (-not (Test-Path (Join-Path $env:AVEN_DATA_DIR "conversations.db"))) { throw "Database was not created" }
          Get-Content (Join-Path $env:AVEN_DATA_DIR "logs\aven.log")
          # The bundled AVEN Local engine must start on Windows.
          & "dist\AVEN AI\_internal\engine\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled llama-server failed to run" }

      - name: Test the installer (silent per-user install, launch, uninstall)
        run: |
          $setup = Get-ChildItem dist\AVEN-AI-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "aven-install"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir "AVEN AI.exe"))) { throw "AVEN AI.exe was not installed" }
          $env:AVEN_DATA_DIR = Join-Path $env:RUNNER_TEMP "aven-installed-data"
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process (Join-Path $dir "AVEN AI.exe") -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Installed app exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)" }

      - name: Microsoft Defender scan
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "::warning::Microsoft Defender is not available on this runner"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          $target = (Resolve-Path dist).Path
          & $mp -Scan -ScanType 3 -File $target -DisableRemediation | Out-Host
          $code = $LASTEXITCODE
          if ($code -eq 2) { throw "Microsoft Defender reported a detection in the build output" }
          if ($code -ne 0) { Write-Host "::warning::Defender scan could not complete (exit code $code)" }
          else { Write-Host "Microsoft Defender: no threats found in $target" }

      - name: SHA-256 checksums
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AVEN-AI-Desktop-Windows
          path: |
            aven_ai_desktop/dist/AVEN-AI-Setup-*.exe
            aven_ai_desktop/dist/AVEN-AI-Desktop-*-win64.zip
            aven_ai_desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
