name: Evaluate AVEN models

# Real answers from the real on-device models, scored with deterministic checks
# (aven_ai_desktop/evals). Each model runs twice with the same cases: on the baseline
# release and on the current code, so improvements and regressions are measured.
on:
  push:
    paths:
      - "aven_ai_desktop/app/ai/**"
      - "aven_ai_desktop/app/local/**"
      - "aven_ai_desktop/app/config/**"
      - "aven_ai_desktop/evals/**"
      - ".github/workflows/evaluate-aven-models.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # AVEN AI 1.2.0 as released (before the 2.0 models).
  BASELINE_REF: b0e59c95a1b1e047e1f022810e0ca9fb92182923

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Each slot compares the 2.0 model with the 1.2.0 model it replaces.
        include:
          - {slot: main, variant: baseline, model: aven-1-1}
          - {slot: main, variant: current, model: aven-2}
          - {slot: core, variant: baseline, model: aven-core}
          - {slot: core, variant: current, model: aven-core}
          - {slot: light, variant: baseline, model: aven-light}
          - {slot: light, variant: current, model: aven-light}
          - {slot: ultra, variant: baseline, model: aven-ultra}
          - {slot: ultra, variant: current, model: aven-ultra}
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        if: matrix.variant == 'baseline'
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spellcheckers (hspell for Hebrew, aspell for English)
        run: sudo apt-get update && sudo apt-get install -y hspell aspell aspell-en
      - run: pip install -r current/aven_ai_desktop/requirements.txt
      - name: Fetch the llama.cpp engine
        working-directory: current/aven_ai_desktop
        run: python scripts/fetch_engine.py --platform linux-x64
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aven-data/models
          key: aven-models-${{ matrix.slot }}-${{ matrix.variant }}-v2
      - name: Evaluate ${{ matrix.model }} (${{ matrix.variant }})
        working-directory: current/aven_ai_desktop
        env:
          AVEN_DATA_DIR: ${{ runner.temp }}/aven-data
          APP_ROOT: ${{ matrix.variant == 'baseline' && '../../baseline/aven_ai_desktop' || '.' }}
        run: >
          python evals/run_eval.py --model ${{ matrix.model }} --label ${{ matrix.variant }} --slot ${{ matrix.slot }}
          --app-root "$APP_ROOT" --out "${{ runner.temp }}/results-${{ matrix.slot }}-${{ matrix.variant }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.slot }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/results-*.json
          if-no-files-found: ignore

  compare:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: results
      - run: python aven_ai_desktop/evals/compare.py results
