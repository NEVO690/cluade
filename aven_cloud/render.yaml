# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from the repository; set ANTHROPIC_API_KEY in the Render dashboard (never in this file).
services:
  - type: web
    name: aven-cloud
    runtime: docker
    rootDir: aven_cloud
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AVEN_TRUST_PROXY
        value: "true"
      - key: AVEN_REQUESTS_PER_DAY
        value: "300"
      - key: AVEN_REQUESTS_PER_MINUTE
        value: "20"
